<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Notes App</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <header class="app-header">
        <h1 class="app-title">My Notes</h1>
        <div class="header-controls">
            <input type="text" id="searchInput" placeholder="Search notes...">
            <button id="newNoteButton">New Note</button>
        </div>
    </header>

    <main class="app-content">
        <aside class="notes-list-sidebar">
            <!-- Notes will be dynamically loaded here -->
        </aside>
        <section class="note-editor hidden">
            <input type="text" id="noteTitle" placeholder="Note Title">
            <textarea id="noteContentArea" placeholder="Write your note here..."></textarea>
            <div class="editor-actions">
                <button id="saveNoteButton">Save</button>
                <button id="deleteNoteButton">Delete</button>
                <button id="closeNoteButton">Close</button>
            </div>
        </section>
    </main>
    <script src="js/app.js"></script>
</body>
</html>
